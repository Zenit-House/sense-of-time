<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --ink: #15140f;
        --accent: #e8491d;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #f2795a;
      }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      /* The world: a soft gradient with blurred blobs for depth of field, and glass spheres. */
      #bg-a {
        position: absolute; inset: 0;
        background: radial-gradient(120% 75% at 50% 26%, #f79070 0%, #e8623f 48%, #c4462c 100%);
      }
      #bg-b { position: absolute; inset: 0; background: radial-gradient(90% 50% at 50% 30%, #3a1f16 0%, #15140f 70%); opacity: 0; }
      #tint { position: absolute; inset: 0; background: #b8452a; opacity: 0; }
      .blob {
        position: absolute; border-radius: 50%;
        background: #ffffff; opacity: 0.35; filter: blur(90px);
      }
      #blob1 { left: -200px; top: 200px; width: 700px; height: 700px; }
      #blob2 { left: 520px; top: 900px; width: 620px; height: 620px; opacity: 0.28; }
      #blob3 { left: 120px; top: 1500px; width: 760px; height: 500px; opacity: 0.3; }
      .sphere {
        position: absolute; border-radius: 50%;
        background: radial-gradient(circle at 34% 30%, rgba(255,255,255,0.96) 0%, rgba(255,255,255,0.45) 28%, rgba(255,255,255,0.08) 62%, rgba(255,255,255,0.3) 100%);
        border: 1px solid rgba(255,255,255,0.7);
        box-shadow: inset -10px -14px 30px rgba(220,90,50,0.25), 0 20px 50px rgba(120,40,10,0.18);
        z-index: 2;
      }
      #sph1 { left: 60px; top: 1120px; width: 120px; height: 120px; }
      #sph2 { left: 900px; top: 330px; width: 84px; height: 84px; }
      #sph3 { left: 940px; top: 1440px; width: 60px; height: 60px; z-index: 6; }
      #s1, #s2, #s3, #s4 { z-index: 5; }
    </style>
  </head>

    <script>
      const tl = gsap.timeline({ paused: true });
      // Depth-of-field blobs and glass spheres drift slowly for the whole film (3-5 px/s).
      tl.fromTo("#blob1", { x: 0, y: 0 }, { x: 90, y: -60, duration: 38.4, ease: "none" }, 0);
      tl.fromTo("#blob2", { x: 0, y: 0 }, { x: -120, y: 80, duration: 38.4, ease: "none" }, 0);
      tl.fromTo("#blob3", { x: 0, y: 0 }, { x: 60, y: -110, duration: 38.4, ease: "none" }, 0);
      tl.fromTo("#sph1", { x: 0, y: 0 }, { x: 40, y: -140, duration: 38.4, ease: "none" }, 0);
      tl.fromTo("#sph2", { x: 0, y: 0 }, { x: -70, y: 120, duration: 38.4, ease: "none" }, 0);
      tl.fromTo("#sph3", { x: 0, y: 0 }, { x: -30, y: -90, duration: 38.4, ease: "none" }, 0);
      // Colour shifts between beats: deeper for the "why", back for the "what you get", ink for the end card.
      tl.to("#tint", { opacity: 0.22, duration: 0.5, ease: "power2.inOut" }, 9.2);
      tl.to("#tint", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 19.8);
      tl.to("#bg-b", { opacity: 1, duration: 0.6, ease: "power2.inOut" }, 30.7);
      tl.to(".blob", { opacity: 0.08, duration: 0.6, ease: "power2.inOut" }, 30.7);
      tl.to(".sphere", { opacity: 0.45, duration: 0.6, ease: "power2.inOut" }, 30.7);
      window.__timelines["main"] = tl;
